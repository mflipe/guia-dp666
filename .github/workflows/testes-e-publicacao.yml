# A cada envio: gera o guia e roda os testes (navegação, ferramentas, rádio virtual, app offline, páginas de leitura
# e acessibilidade). No main, se tudo passar, publica na branch gh-pages, que o GitHub Pages serve, sem apagar as
# prévias (prototipo-*). A regressão visual fica de fora: as fotos de referência valem para a máquina onde foram feitas.
name: Testes e publicação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            viewer3d/package-lock.json
            testes/package-lock.json

      - name: Dependências
        run: |
          pip install -r requirements.txt
          (cd viewer3d && npm ci --no-audit --no-fund)
          (cd testes && npm ci --no-audit --no-fund)

      - name: Gerar o guia
        run: |
          (cd viewer3d && npm run build)
          python3 site/build.py

      - name: Testes
        working-directory: testes
        env:
          CHROME: /usr/bin/google-chrome
        run: node todos.mjs

      - name: Guardar o site gerado
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/preview
          retention-days: 7

  publicar:
    needs: testes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publicar-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/preview

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Copiar para a gh-pages, sem apagar as prévias
        run: scripts/copiar-para-pages.sh pages

      - name: Enviar
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git commit -m "Site gerado a partir de ${GITHUB_SHA::7}"
          git push
